DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NXR / TAP PROTOCOL</title>
    <!-- Include Telegram SDK -->
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #050b14; color: #ffffff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding-bottom: 80px; }
        
        /* Layout Headers */
        .header { text-align: center; margin-top: 25px; }
        .protocol-title { font-size: 11px; letter-spacing: 3px; color: #4da3ff; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8; }
        .subtitle { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        
        /* Balance Dashboard */
        .balance-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .coin-icon { font-size: 32px; color: #4da3ff; filter: drop-shadow(0 0 8px #4da3ff); }
        .balance { font-size: 54px; font-weight: bold; }
        .currency-label { font-size: 11px; letter-spacing: 1.5px; color: #708090; font-weight: bold; margin-left: 5px; align-self: flex-end; padding-bottom: 12px; }

        /* Main Click Target Area */
        .tap-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .outer-ring { width: 280px; height: 280px; border-radius: 50%; border: 2px solid rgba(77, 163, 255, 0.2); display: flex; align-items: center; justify-content: center; }
        .inner-ring { width: 250px; height: 250px; border-radius: 50%; border: 1px solid rgba(77, 163, 255, 0.4); display: flex; align-items: center; justify-content: center; }
        .tap-button { width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle, #102542 0%, #071324 100%); border: 2px solid #1a365d; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.05s ease; box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 40px rgba(16, 37, 66, 0.8); position: relative; }
        .tap-button:active { transform: scale(0.96); border-color: #4da3ff; box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 50px rgba(77, 163, 255, 0.4); }
        .tap-text { font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #ffffff; margin-bottom: 6px; }
        .tap-value { font-size: 12px; color: #4da3ff; letter-spacing: 1px; font-weight: 500; }

        /* Score Popups */
        .floating-text { position: absolute; color: #4da3ff; font-size: 26px; font-weight: bold; pointer-events: none; animation: floatUp 0.6s ease-out forwards; text-shadow: 0 0 8px rgba(77,163,255,0.6); z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(0.8); } }

        /* Energy Stats Tracker */
        .energy-section { padding: 0 30px; margin-bottom: 25px; width: 100%; }
        .energy-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: bold; }
        .energy-label { color: #708090; text-transform: uppercase; letter-spacing: 1px; }
        .energy-value { font-variant-numeric: tabular-nums; }
        .progress-container { width: 100%; height: 12px; background-color: #0b1524; border-radius: 6px; padding: 2px; border: 1px solid #142238; }
        .progress-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #3b42c4 0%, #4da3ff 100%); border-radius: 4px; transition: width 0.1s linear; }

        /* Application Footnotes Navigation */
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: linear-gradient(to top, #03070d 0%, #07111f 100%); border-top: 1px solid #12223a; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #52637a; text-decoration: none; font-size: 9px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; flex: 1; height: 100%; justify-content: center; }
        .nav-item.active { color: #4da3ff; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="protocol-title">NXR / TAP PROTOCOL</div>
        <div class="subtitle">Build your energy.</div>
    </div>

    <div class="balance-container">
        <span class="coin-icon">✦</span>
        <span class="balance" id="coinsDisplay">0</span>
        <span class="currency-label">GAME COINS</span>
    </div>
